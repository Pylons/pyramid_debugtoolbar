[tox]
envlist =
    lint,
    py311,py312,py313,py314,py315,pypy311,
    py311-pyramid15,
    py311-pyramid110,
    py311-sqlalchemy14,
    docs,
    coverage
isolated_build = True

[testenv]
deps =
    # oldest pyramid that runs on python 3.11, 1.4 uses the removed inspect.getargspec
    pyramid15: pyramid <= 1.5.99
    # last 1.x release, before 2.0 removed deprecated apis
    pyramid110: pyramid <= 1.10.99
    # oldest supported sqlalchemy
    sqlalchemy14: sqlalchemy < 2.0
    # pyramid < 2.1 imports pkg_resources, removed in setuptools 82
    pyramid15,pyramid110: setuptools < 82
commands =
    python --version
    pytest \
    cover: --cov \
        {posargs:}
dependency_groups =
    testing
setenv =
    COVERAGE_FILE=.coverage.{envname}

[testenv:coverage]
skip_install = True
commands =
    coverage combine
    coverage xml
    coverage report
deps =
    coverage
dependency_groups =
setenv =
    COVERAGE_FILE=.coverage
depends = py314-cover

[testenv:lint]
skip_install = True
commands =
    isort --check-only --df src/pyramid_debugtoolbar tests
    black --check --diff src/pyramid_debugtoolbar tests
    flake8 src/pyramid_debugtoolbar tests
    check-manifest
    # build sdist/wheel
    python -m build .
    twine check dist/*
dependency_groups =
    lint

[testenv:docs]
allowlist_externals = make
commands =
    make -C docs html epub BUILDDIR={envdir}
dependency_groups =
    docs

[testenv:format]
skip_install = true
commands =
    isort src/pyramid_debugtoolbar tests
    black src/pyramid_debugtoolbar tests
dependency_groups =
    lint

[testenv:build]
skip_install = true
commands =
    # clean up build/ and dist/ folders
    python -c 'import shutil; shutil.rmtree("build", ignore_errors=True)'
    # Make sure we aren't forgetting anything
    check-manifest
    # build sdist/wheel
    python -m build .
    # Verify all is well
    twine check dist/*
dependency_groups =
    lint
